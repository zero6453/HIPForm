[project]
name = "hipform"
version = "0.1.0"
description = "Configurable HIP forming surrogate and surface tolerance reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "scikit-fem>=11,<13",
    "gmsh>=4.13,<5",
    "meshio>=5.3,<6",
    "trimesh>=4.5,<5",
    "rtree>=1.3,<2",
    "plotly>=6,<7",
    "PyYAML>=6,<7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.20,<1",
    "filelock>=3.15,<4",
]

[project.scripts]
hipform = "hipform.cli:main"
hip-sim = "hipform.cli:main"

[project.urls]
Repository = "https://github.com/zero6453/HIPForm"
Reports = "https://zero6453.github.io/HIPForm/"

[dependency-groups]
dev = ["pytest>=8.2,<9", "matplotlib>=3.9,<4", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hipform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
